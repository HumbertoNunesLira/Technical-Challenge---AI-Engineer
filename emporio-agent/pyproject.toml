[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "emporio"
version = "0.1.0"
description = "Customer support agent for Empório da Música (AI Engineer take-home)"
requires-python = ">=3.11"
# Runtime dependencies are listed in requirements.txt, the single install entry point.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["llm: calls a real LLM provider (deselected by default)"]
addopts = "-m 'not llm'"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
